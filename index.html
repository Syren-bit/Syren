<!-- Syren v10 Final fixed6: expense layout fix -->
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#171522">
<title>Syren｜遊戲生活管理器</title>
<style>
:root{
  --bg:#100e18;--panel:#171522;--panel2:#1c1929;--line:#373147;
  --text:#f5f1ff;--muted:#aaa1bf;--purple:#b99aff;--purple2:#8f70df;
  --danger:#ff829d;--ok:#8fdfc0;--shadow:0 12px 35px #0004;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  background:radial-gradient(circle at 15% 0,#29213c 0,#100e18 38%);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Segoe UI",sans-serif;
  min-height:100vh;
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.app{
  width:min(1180px,100%);
  margin:0 auto;
  padding:28px 24px 60px;
}
header,.card{
  background:linear-gradient(145deg,#191724,#15131f);
  border:1px solid var(--line);
  border-radius:24px;
  box-shadow:var(--shadow);
}
header{
  padding:25px 28px;
  margin-bottom:20px;
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  align-items:center;
  gap:20px;
}
.eyebrow{font-size:11px;letter-spacing:4px;color:#c7b5ef}
.title{font-size:29px;line-height:1.25;font-weight:800;margin:5px 0}
.sub{color:var(--muted);font-size:14px;line-height:1.6}
.grid{
  display:grid;
  grid-template-columns:minmax(0,1.08fr) minmax(340px,.92fr);
  gap:20px;
  align-items:start;
}
main,aside{min-width:0}
.card{
  padding:23px;
  margin-bottom:20px;
  min-width:0;
}
.card h2{
  font-size:21px;
  line-height:1.3;
  margin:7px 0 16px;
}
.label{font-size:13px;color:var(--muted);line-height:1.4}
.topline{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:14px;
  min-width:0;
}
.topline>div{min-width:0}
.topline .btn{flex:0 0 auto}
.icon{margin-right:7px}
.btn{
  border:1px solid var(--line);
  background:#191624;
  color:var(--text);
  padding:10px 15px;
  border-radius:13px;
  white-space:nowrap;
  transition:border-color .15s,transform .15s,background .15s;
}
.btn:hover{border-color:#7661a5}
.btn:active{transform:translateY(1px)}
.primary{
  background:var(--purple);
  color:#171321;
  border-color:transparent;
  font-weight:800;
}
.small{padding:7px 10px;font-size:13px}
.games{
  display:flex;
  gap:10px;
  overflow-x:auto;
  padding:3px 0 9px;
  scrollbar-width:none;
  min-width:0;
}
.games::-webkit-scrollbar,.filters::-webkit-scrollbar{display:none}
.game{
  min-width:125px;
  text-align:left;
  flex:0 0 auto;
}
.game.active{background:#8f70df;color:white;border-color:#b99aff}
.empty{
  border:1px dashed var(--line);
  padding:20px;
  border-radius:16px;
  text-align:center;
  color:var(--muted);
}
.filters{
  display:flex;
  gap:7px;
  overflow-x:auto;
  padding:0 0 9px;
  scrollbar-width:none;
  min-width:0;
}
.chip{
  white-space:nowrap;
  flex:0 0 auto;
  border:1px solid var(--line);
  background:transparent;
  color:#c8bfda;
  padding:8px 12px;
  border-radius:12px;
}
.chip.active{border-color:var(--purple);color:white;background:#2a2140}
.task{
  display:grid;
  grid-template-columns:21px minmax(0,1fr) auto;
  align-items:center;
  gap:12px;
  padding:13px 2px;
  border-bottom:1px solid #292536;
  min-width:0;
}
.task:last-child{border-bottom:0}
.task .check{
  width:21px;
  height:21px;
  margin:0;
  accent-color:var(--purple);
}
.task .task-content{min-width:0}
.task.done .taskname{text-decoration:line-through;color:#82798f}
.taskname{
  font-weight:700;
  line-height:1.45;
  overflow-wrap:anywhere;
}
.meta{
  font-size:12px;
  color:var(--muted);
  margin-top:4px;
  line-height:1.55;
  overflow-wrap:anywhere;
}
.danger{color:var(--danger)}
.ok{color:var(--ok)}
.expense-total{font-size:35px;line-height:1.1;font-weight:850;margin:8px 0}
.expense{
  display:grid;
  grid-template-columns:minmax(0,1fr) minmax(145px,auto);
  gap:14px;
  align-items:center;
  padding:12px 0;
  border-bottom:1px solid #292536;
  min-width:0;
}
.expense:last-child{border:0}
.expense>div{min-width:0}
.expense b{
  overflow-wrap:anywhere;
  word-break:normal;
}
.expense-side{
  min-width:145px;
  display:flex;
  flex-direction:column;
  align-items:flex-end;
  gap:6px;
}
.expense-amount{
  white-space:nowrap;
  overflow-wrap:normal!important;
  word-break:keep-all;
}
.actions-inline{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
  justify-content:flex-end;
}
.modal{
  position:fixed;
  inset:0;
  background:#08070db8;
  display:none;
  align-items:center;
  justify-content:center;
  padding:18px;
  z-index:10;
}
.modal.show{display:flex}
#gameModal,#taskModal,#expenseModal{z-index:20}
#dataModal{z-index:10}
.dialog{
  width:min(560px,100%);
  max-height:90vh;
  overflow:auto;
  background:#191724;
  border:1px solid var(--line);
  border-radius:22px;
  padding:22px;
}
.form{display:grid;gap:12px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{display:grid;gap:6px}
.field label{font-size:13px;color:var(--muted)}
input,select,textarea{
  width:100%;
  background:#11101a;
  border:1px solid var(--line);
  color:var(--text);
  border-radius:11px;
  padding:11px 12px;
  outline:none;
}
input:focus,select:focus,textarea:focus{border-color:var(--purple)}
.actions{
  display:flex;
  justify-content:flex-end;
  gap:9px;
  margin-top:6px;
}
.hidden{display:none!important}
.manage-list{display:grid;gap:8px}
.manage-item{
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  gap:10px;
  align-items:center;
  padding:10px 0;
  border-bottom:1px solid #292536;
}
.manage-item span{min-width:0;overflow-wrap:anywhere}.manage-item .actions-inline{flex-wrap:wrap}
footer{text-align:center;color:#70697e;font-size:12px;margin-top:12px}

@media(max-width:900px){
  .grid{grid-template-columns:minmax(0,1fr) minmax(300px,.78fr)}
  .app{padding-left:18px;padding-right:18px}
}

@media(max-width:760px){
  .app{padding:14px 12px 45px}
  header{
    padding:19px;
    border-radius:20px;
    grid-template-columns:minmax(0,1fr) auto;
    gap:12px;
  }
  .title{font-size:24px}
  .sub{font-size:13px}
  header>.btn{padding:9px 12px}
  .grid{display:block}
  .card{
    padding:17px;
    border-radius:19px;
    margin-bottom:13px;
  }
  .card h2{font-size:21px;margin-bottom:15px}
  .topline{gap:10px}
  .topline .btn{padding:9px 12px}
  .games{gap:9px;margin-right:-2px}
  .game{min-width:110px}
  .filters{gap:7px;margin-right:-2px}
  .chip{padding:8px 12px}
  .task{
    grid-template-columns:21px minmax(0,1fr) auto;
    gap:10px;
    padding:14px 1px;
  }
  .task .btn{padding:7px 10px}
  .taskname{font-size:16px}
  .meta{font-size:12px}
  .expense-total{font-size:30px}
  .expense{
    grid-template-columns:minmax(0,1fr);
    gap:8px;
  }
  .expense-side{
    min-width:0;
    width:100%;
    flex-direction:row;
    align-items:center;
    justify-content:space-between;
    gap:10px;
  }
  .actions-inline{justify-content:flex-end}
  .row{grid-template-columns:1fr}
  .dialog{padding:19px;border-radius:20px}
}

@media(max-width:430px){
  header{
    grid-template-columns:minmax(0,1fr);
  }
  header>.btn{justify-self:end}
  .topline .btn{font-size:14px}
  .task{grid-template-columns:21px minmax(0,1fr) auto}
}
</style>
</head>
<body>
<div class="app">
<header>
  <div><div class="eyebrow">SYREN</div><div class="title">遊戲生活管理器</div><div class="sub">把遊戲活動與固定支出，都放在這裡。</div></div>
  <button class="btn" onclick="openModal('dataModal')">⚙️ 資料管理</button>
</header>

<div class="grid">
<main>
<section class="card game-card">
  <div class="topline"><div><div class="label">🎮 遊戲</div><h2>我的遊戲</h2></div><button class="btn primary" onclick="openModal('gameModal')">＋ 新增遊戲</button></div>
  <div id="games" class="games"></div>
</section>

<section class="card task-card" id="taskSection">
  <div class="topline"><div><div class="label">📋 任務</div><h2>任務中心</h2></div><button class="btn" onclick="openModal('taskModal')">＋ 新增任務</button></div>
  <div id="filters" class="filters"></div>
  <div id="tasks"></div>
</section>
</main>

<aside>
<section class="card">
  <div class="topline"><div><div class="label">💳 每月固定支出</div><div class="expense-total" id="total">NT$ 0</div><div class="sub" id="annual">年度預估 NT$ 0</div></div><button class="btn" onclick="openModal('expenseModal')">＋ 新增</button></div>
  <div id="expenses"></div>
</section>
<section class="card">
  <div class="label">⌛</div><h2>最近截止</h2><div id="deadlines"></div>
</section>
</aside>
</div>
<footer>Syren · 資料儲存在這台裝置的瀏覽器中</footer>
</div>

<div class="modal" id="gameModal"><div class="dialog">
<h2 id="gameModalTitle">新增遊戲</h2><form class="form" onsubmit="saveGame(event)">
<div class="field"><label>遊戲名稱</label><input id="gameName" required placeholder="例如：戀與深空"><input id="editGameId" type="hidden"></div>
<div class="actions"><button type="button" class="btn" onclick="closeModals()">取消</button><button id="gameSubmitBtn" type="submit" class="btn primary">新增</button></div></form></div></div>

<div class="modal" id="taskModal"><div class="dialog">
<h2 id="taskModalTitle">新增任務</h2><form class="form" onsubmit="saveTask(event)">
<div class="field"><label>任務名稱</label><input id="taskName" required placeholder="例如：每日登入"></div>
<div class="row">
<div class="field"><label>遊戲</label><select id="taskGame" required></select></div>
<div class="field"><label>類型</label><select id="taskType"><option value="daily">每日</option><option value="weekly">每週</option><option value="monthly">每月</option><option value="version">版本</option><option value="limited">限時</option></select></div>
</div>
<div class="field"><label>截止日期（可留空）</label><input id="taskDue" type="date"></div>
<div class="field"><label>備註</label><textarea id="taskNote" rows="3" placeholder="可填活動版本、時間或其他提醒"></textarea><input id="editTaskId" type="hidden"></div>
<div class="actions"><button type="button" class="btn" onclick="closeModals()">取消</button><button class="btn primary">新增任務</button></div></form></div></div>

<div class="modal" id="expenseModal"><div class="dialog">
<h2 id="expenseModalTitle">新增固定支出</h2><form class="form" onsubmit="saveExpense(event)">
<div class="field"><label>項目名稱</label><input id="expenseName" required placeholder="例如：YouTube Premium"><input id="editExpenseId" type="hidden"></div>
<div class="row"><div class="field"><label>每月金額</label><input id="expenseAmount" type="number" min="0" required placeholder="0"></div><div class="field"><label>扣款日（可留空）</label><input id="expenseDay" type="number" min="1" max="31" placeholder="例如 15"></div></div>
<div class="actions"><button type="button" class="btn" onclick="closeModals()">取消</button><button id="expenseSubmitBtn" type="submit" class="btn primary">新增</button></div></form></div></div>

<div class="modal" id="dataModal"><div class="dialog">
<h2>資料管理</h2><p class="sub">資料會自動儲存在瀏覽器。換手機前建議先匯出備份。</p>
<div class="actions" style="justify-content:flex-start;flex-wrap:wrap">
<button class="btn" onclick="exportData()">⬇️ 匯出資料</button>
<button class="btn" onclick="document.getElementById('importFile').click()">⬆️ 匯入資料</button>
<input id="importFile" type="file" accept=".json" class="hidden" onchange="importData(event)">
</div>
<hr style="border-color:#292536;margin:20px 0">
<div id="manageGames" class="manage-list"></div>
<div class="actions"><button type="button" class="btn" onclick="clearAllData()">清空全部資料</button><button class="btn" onclick="closeModals()">關閉</button></div>
</div></div>

<script>
const KEY='syren_v7_data';
let data=JSON.parse(localStorage.getItem(KEY)||'null')||{games:[],tasks:[],expenses:[]};
let selectedGame='all', selectedType='all';

function persist(){localStorage.setItem(KEY,JSON.stringify(data));render()}
function esc(s=''){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function money(n){return 'NT$ '+Number(n||0).toLocaleString('zh-TW')}
function openModal(id){
  if(id==='gameModal') resetGameForm();
  if(id==='taskModal'){resetTaskForm();fillGameSelect();}
  if(id==='expenseModal') resetExpenseForm();
  if(id==='dataModal') renderManage();
  document.getElementById(id).classList.add('show')
}
function closeModals(){document.querySelectorAll('.modal').forEach(x=>x.classList.remove('show'))}
document.querySelectorAll('.modal').forEach(m=>m.addEventListener('click',e=>{if(e.target===m)m.classList.remove('show')}));

function resetGameForm(){document.getElementById('gameModalTitle').textContent='新增遊戲';document.getElementById('gameSubmitBtn').textContent='新增';document.getElementById('gameName').value='';document.getElementById('editGameId').value=''}
function editGame(id){const g=data.games.find(x=>x.id===id);if(!g)return;document.getElementById('dataModal').classList.remove('show');document.getElementById('gameModalTitle').textContent='編輯遊戲';document.getElementById('gameSubmitBtn').textContent='儲存修改';document.getElementById('gameName').value=g.name;document.getElementById('editGameId').value=g.id;document.getElementById('gameModal').classList.add('show');setTimeout(()=>document.getElementById('gameName').focus(),50)}
function saveGame(e){e.preventDefault();const id=document.getElementById('editGameId').value,name=document.getElementById('gameName').value.trim();if(!name)return;if(id){const g=data.games.find(x=>x.id===id);if(g)g.name=name}else data.games.push({id:crypto.randomUUID(),name});e.target.reset();closeModals();persist()}
function fillGameSelect(){const s=document.getElementById('taskGame');s.innerHTML=data.games.length?data.games.map(g=>`<option value="${g.id}">${esc(g.name)}</option>`).join(''):'<option value="">請先新增遊戲</option>'}
function resetTaskForm(){document.getElementById('taskModalTitle').textContent='新增任務';document.getElementById('taskName').value='';document.getElementById('taskDue').value='';document.getElementById('taskNote').value='';document.getElementById('editTaskId').value='';document.getElementById('taskType').value='daily'}
function editTask(id){const t=data.tasks.find(x=>x.id===id);if(!t)return;fillGameSelect();document.getElementById('taskModalTitle').textContent='編輯任務';document.getElementById('taskName').value=t.name;document.getElementById('taskGame').value=t.gameId;document.getElementById('taskType').value=t.type;document.getElementById('taskDue').value=t.due||'';document.getElementById('taskNote').value=t.note||'';document.getElementById('editTaskId').value=t.id;document.getElementById('taskModal').classList.add('show')}
function saveTask(e){e.preventDefault();if(!data.games.length){alert('請先新增遊戲');return}const id=document.getElementById('editTaskId').value,payload={name:document.getElementById('taskName').value.trim(),gameId:document.getElementById('taskGame').value,type:document.getElementById('taskType').value,due:document.getElementById('taskDue').value,note:document.getElementById('taskNote').value.trim()};if(!payload.name)return;if(id){const t=data.tasks.find(x=>x.id===id);if(t)Object.assign(t,payload)}else data.tasks.push({...payload,id:crypto.randomUUID(),done:{}});e.target.reset();closeModals();persist()}
function resetExpenseForm(){document.getElementById('expenseModalTitle').textContent='新增固定支出';document.getElementById('expenseSubmitBtn').textContent='新增';document.getElementById('expenseName').value='';document.getElementById('expenseAmount').value='';document.getElementById('expenseDay').value='';document.getElementById('editExpenseId').value=''}
function editExpense(id){const x=data.expenses.find(e=>e.id===id);if(!x)return;document.getElementById('expenseModalTitle').textContent='編輯固定支出';document.getElementById('expenseSubmitBtn').textContent='儲存修改';document.getElementById('expenseName').value=x.name;document.getElementById('expenseAmount').value=x.amount;document.getElementById('expenseDay').value=x.day||'';document.getElementById('editExpenseId').value=x.id;document.getElementById('expenseModal').classList.add('show')}
function saveExpense(e){e.preventDefault();const id=document.getElementById('editExpenseId').value,payload={name:document.getElementById('expenseName').value.trim(),amount:+document.getElementById('expenseAmount').value,day:document.getElementById('expenseDay').value};if(!payload.name)return;if(id){const x=data.expenses.find(e=>e.id===id);if(x)Object.assign(x,payload)}else data.expenses.push({...payload,id:crypto.randomUUID()});e.target.reset();closeModals();persist()}

function periodKey(t){
 const d=new Date(), y=d.getFullYear(), m=d.getMonth()+1;
 if(t.type==='daily') return `${y}-${m}-${d.getDate()}`;
 if(t.type==='weekly'){const x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return 'w-'+x.toISOString().slice(0,10)}
 if(t.type==='monthly') return `${y}-${m}`;
 return 'once';
}
function toggleTask(id){
 const t=data.tasks.find(x=>x.id===id), k=periodKey(t);
 if(t.type==='limited'||t.type==='version'){t.done[k]=!t.done[k]}else t.done[k]=!t.done[k];
 persist()
}
function deleteGame(id){
 const g=data.games.find(x=>x.id===id);
 if(!g)return;
 if(!window.confirm('確定要刪除「'+g.name+'」嗎？\n\n與這個遊戲相關的任務也會一併刪除。'))return;
 data.games=data.games.filter(x=>x.id!==id);
 data.tasks=data.tasks.filter(x=>x.gameId!==id);
 if(selectedGame===id)selectedGame='all';
 persist();
 render();
 renderManage();
}
function deleteTask(id){
 const t=data.tasks.find(x=>x.id===id); if(!t)return;
 if(!confirm(`確定要刪除任務「${t.name}」嗎？`))return;
 data.tasks=data.tasks.filter(x=>x.id!==id);
 persist(); render(); renderManage();
}
function gameName(id){return data.games.find(g=>g.id===id)?.name||'未分類'}
const typeName={daily:'每日',weekly:'每週',monthly:'每月',version:'版本',limited:'限時'};

function clearAllData(){
 if(!confirm('確定要清空所有遊戲、任務與固定支出嗎？此操作無法復原，建議先匯出備份。'))return;
 data={games:[],tasks:[],expenses:[]};
 selectedGame='all'; selectedType='all';
 persist(); render(); renderManage();
 alert('已清空全部資料。');
}
function deleteExpense(id){
 const x=data.expenses.find(e=>e.id===id); if(!x)return;
 if(!confirm(`確定要刪除固定支出「${x.name}」嗎？`))return;
 data.expenses=data.expenses.filter(e=>e.id!==id);
 persist(); render(); renderManage();
}
function render(){
 const games=document.getElementById('games');
 games.innerHTML=data.games.length?data.games.map(g=>`<button class="btn game ${selectedGame===g.id?'active':''}" onclick="selectGame('${g.id}')">🎮 ${esc(g.name)}</button>`).join(''):'<div class="empty" style="width:100%">還沒有遊戲。新增一個開始吧！</div>';
 const filters=[['all','全部'],['daily','每日'],['weekly','每週'],['monthly','每月'],['version','版本'],['limited','限時']];
 document.getElementById('filters').innerHTML=filters.map(([k,n])=>`<button class="chip ${selectedType===k?'active':''}" onclick="selectType('${k}')">${n}</button>`).join('');
 let ts=data.tasks.filter(t=>(selectedGame==='all'||t.gameId===selectedGame)&&(selectedType==='all'||t.type===selectedType));
 document.getElementById('tasks').innerHTML=ts.length?ts.map(t=>{
   const done=!!t.done[periodKey(t)], due=t.due?new Date(t.due+'T23:59:59'):null, today=new Date();
   const late=due&&due<today&&!done;
   return `<div class="task ${done?'done':''}">
   <input class="check" type="checkbox" ${done?'checked':''} onchange="toggleTask('${t.id}')">
   <div class="task-content"><div class="taskname">${esc(t.name)}</div>
   <div class="meta">🎮 ${esc(gameName(t.gameId))}　·　${typeName[t.type]}${t.due?'　·　截止 '+esc(t.due):''}${late?'　<span class="danger">已逾期</span>':''}</div>
   ${t.note?`<div class="meta">${esc(t.note)}</div>`:''}</div>
   <div class="actions-inline"><button type="button" class="btn small" onclick="editTask('${t.id}')">編輯</button><button type="button" class="btn small" onclick="deleteTask('${t.id}')">刪除</button></div></div>`
 }).join(''):'<div class="empty">還沒有符合條件的任務。</div>';

 const total=data.expenses.reduce((s,x)=>s+Number(x.amount||0),0);
 document.getElementById('total').textContent=money(total);document.getElementById('annual').textContent='年度預估 '+money(total*12);
 document.getElementById('expenses').innerHTML=data.expenses.length?data.expenses.map(x=>`<div class="expense"><div><b>${esc(x.name)}</b><div class="meta">${x.day?'每月 '+x.day+' 日扣款':'每月固定'}</div></div><div class="expense-side"><b class="expense-amount">${money(x.amount)}</b><div class="actions-inline"><button type="button" class="btn small" onclick="editExpense('${x.id}')">編輯</button><button type="button" class="btn small" onclick="deleteExpense('${x.id}')">刪除</button></div></div></div>`).join(''):'<div class="empty" style="margin-top:18px">還沒有固定支出。</div>';

 const future=data.tasks.filter(t=>t.due&&!t.done[periodKey(t)]).sort((a,b)=>a.due.localeCompare(b.due)).slice(0,5);
 document.getElementById('deadlines').innerHTML=future.length?future.map(t=>`<div class="expense"><div><b>${esc(t.name)}</b><div class="meta">${esc(gameName(t.gameId))}</div></div><span>${esc(t.due)}</span></div>`).join(''):'<div class="empty">還沒有截止日期。</div>';
}
function selectGame(id){selectedGame=selectedGame===id?'all':id;render();document.getElementById('taskSection').scrollIntoView({behavior:'smooth',block:'start'})}
function selectType(k){selectedType=k;render()}
function renderManage(){document.getElementById('manageGames').innerHTML=data.games.length?data.games.map(g=>`<div class="manage-item"><span>🎮 ${esc(g.name)}</span><div class="actions-inline"><button type="button" class="btn small" onclick="editGame('${g.id}')">編輯</button><button type="button" class="btn small" onclick="deleteGame('${g.id}')">刪除</button></div></div>`).join(''):'<div class="empty">還沒有遊戲。</div>'}
function exportData(){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Syren-備份.json';a.click();URL.revokeObjectURL(a.href)}
function importData(e){
 const f=e.target.files[0];if(!f)return;const r=new FileReader();
 r.onload=()=>{try{const x=JSON.parse(r.result);if(!x.games||!x.tasks||!x.expenses)throw Error();data=x;persist();alert('資料匯入成功！')}catch{alert('這不是有效的 Syren 備份檔。')}e.target.value=''};r.readAsText(f)
}
render();
</script>
</body>
</html>
